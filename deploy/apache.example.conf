# Exemplo para Apache 2.4 com mod_rewrite, mod_alias, mod_headers, mod_ssl e um handler PHP.
# Substitua o nome, certificados e caminhos se a instalação usar outra estrutura.

<VirtualHost *:80>
    ServerName example.invalid
    Redirect permanent / https://example.invalid/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.invalid

    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem

    DocumentRoot /var/www/adocat/dist

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # A correspondência de Alias ocorre antes do fallback da SPA. O front
    # controller preserva a URI /api/... usada pelas rotas do backend.
    Alias /api /var/www/adocat/backend/public

    <Directory /var/www/adocat>
        Require all denied
        AllowOverride None
    </Directory>

    <Directory /var/www/adocat/backend/public>
        Require all granted
        AllowOverride All
        Options -Indexes -MultiViews

        <FilesMatch "(^\.|\.env$|\.(?:sqlite|sqlite3|db|sql|log)$)">
            Require all denied
        </FilesMatch>

        # Adapte o socket ao PHP-FPM instalado no servidor.
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>

    <Directory /var/www/adocat/dist>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [END]

        <FilesMatch "^(?:index\.html|sw\.js|manifest\.webmanifest)$">
            Header always set Cache-Control "no-cache"
        </FilesMatch>

        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/adocat-error.log
    CustomLog ${APACHE_LOG_DIR}/adocat-access.log combined
</VirtualHost>
